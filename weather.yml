name: Self Weather Forecast

# cron 是 UTC 时间。北京时间每天 07:00 跑 = UTC 23:00。
# 想改时间：北京时间 = UTC + 8，自己换算。
on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: write      # 允许把生成的图片/CSV 提交回仓库

jobs:
  forecast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Chinese font (WenQuanYi)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-wqy-zenhei
          fc-cache -f

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run forecast
        run: python weather_forecast.py

      # 把最新结果提交回仓库根目录（固定文件名，覆盖旧图）
      - name: Commit results back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f yangzhou_forecast.csv chart_temperature.png chart_others.png
          git commit -m "auto: forecast $(date -u +%Y-%m-%d)" || echo "nothing changed"
          git push

      - name: Upload artifacts (always keep 90 days)
        uses: actions/upload-artifact@v4
        with:
          name: weather-output
          path: |
            *.csv
            *.png
          retention-days: 90
#（注：内容由AI生成）
