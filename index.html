<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>天气 · 自算预报</title>
<style>
  :root{
    --card:#ffffff;
    --ink:#1b2a4a; --sub:#5b6c88; --line:#e6edf6;
    --blue:#2f7fe6; --red:#ff6b6b; --green:#26c281;
    --sk1:#8ec5f7; --sk2:#eef1f6;
    --hover:#eef1f6; --hour-bg:#f3f7fd; --panel-soft:rgba(255,255,255,.5);
    --pop-bg:#ffffff; --pop-title:#1b2a4a;
  }
  /* 深色主题（设置可切换）——全局变量化 */
  html[data-theme="dark"]{
    --card:#1c2433; --ink:#e8edf7; --sub:#8fa1bd; --line:#2c3a52;
    --sk1:#222c42; --sk2:#141a28;
    --hover:#2a3550; --hour-bg:#262f42; --panel-soft:rgba(28,36,51,.6);
    --pop-bg:#1c2433; --pop-title:#e8edf7;
  }
  html[data-theme="dark"] .city-item{color:var(--ink)}
  html[data-theme="dark"] .hour-item.now{background:var(--blue);border-color:var(--blue)}
  html[data-theme="dark"] .sk{background:linear-gradient(90deg,rgba(255,255,255,.08) 25%,rgba(255,255,255,.16) 37%,rgba(255,255,255,.08) 63%);background-size:400% 100%}

  /* ===== 外观：毛玻璃 / 液态玻璃（设置可切换）===== */
  html[data-glass="liquid"] .panel,html[data-glass="liquid"] .gcard,
  html[data-glass="liquid"] #cityMask>div,html[data-glass="liquid"] #setMask>div{
    background:linear-gradient(145deg,rgba(255,255,255,.72),rgba(255,255,255,.32));
    backdrop-filter:blur(24px) saturate(1.8);-webkit-backdrop-filter:blur(24px) saturate(1.8);
    border:1px solid rgba(255,255,255,.55);border-radius:24px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.7),inset 0 -1px 0 rgba(255,255,255,.15),0 10px 34px rgba(31,67,120,.12);
  }
  html[data-glass="liquid"] .gcard{border-radius:22px}
  html[data-glass="liquid"] .nav{
    background:linear-gradient(180deg,rgba(255,255,255,.2),rgba(255,255,255,.04));
    backdrop-filter:blur(18px);border-radius:0 0 22px 22px;
  }
  html[data-glass="liquid"] .hour-item{background:rgba(255,255,255,.55);backdrop-filter:blur(10px);border-radius:16px}
  html[data-glass="liquid"] .set-btn{background:rgba(255,255,255,.7);border-radius:12px}
  html[data-glass="liquid"] .rain-pills .pill{background:rgba(255,255,255,.4);border-color:rgba(255,255,255,.6)}
  /* 液态玻璃下的字体颜色：显式跟随主题变量，保证半透明底上的可读性 */
  html[data-glass="liquid"] .panel,html[data-glass="liquid"] .gcard,
  html[data-glass="liquid"] .hour-item,html[data-glass="liquid"] .panel-title,
  html[data-glass="liquid"] .gcard .v,html[data-glass="liquid"] .gcard .k,
  html[data-glass="liquid"] .fav-row,html[data-glass="liquid"] .daily-row,
  html[data-glass="liquid"] #cityMask>div,html[data-glass="liquid"] #setMask>div,
  html[data-glass="liquid"] #setMask .set-row{color:var(--ink)}
  html[data-glass="liquid"] .gcard .sub,html[data-glass="liquid"] .hour-item .prob,
  html[data-glass="liquid"] #cityCount{color:var(--sub)}
  html[data-theme="dark"][data-glass="liquid"] .panel,html[data-theme="dark"][data-glass="liquid"] .gcard,
  html[data-theme="dark"][data-glass="liquid"] #cityMask>div,html[data-theme="dark"][data-glass="liquid"] #setMask>div{
    background:linear-gradient(145deg,rgba(42,54,74,.75),rgba(24,32,46,.5));border-color:rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.22),0 10px 34px rgba(0,0,0,.35);
  }
  html[data-theme="dark"][data-glass="liquid"] .hour-item{background:rgba(38,47,66,.55)}
  html[data-theme="dark"][data-glass="liquid"] .set-btn{background:rgba(28,36,51,.6)}
  html[data-theme="dark"][data-glass="liquid"] .rain-pills .pill{background:rgba(28,36,51,.65);border-color:rgba(255,255,255,.22)}

  /* ===== 常用城市 ===== */
  .fav-chip{display:inline-flex;width:auto;padding:10px 16px;margin:0;font-size:14px;border-radius:999px}
  .fav-row{display:flex;align-items:center;justify-content:space-between;padding:8px 2px;font-size:13px;color:var(--ink);border-bottom:1px solid var(--line)}
  .fav-row .set-btn{padding:5px 12px;font-size:12px}
  /* ===== 预警横幅 ===== */
  #warnBar{position:relative;z-index:5}
  .warn-item{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff;padding:10px 16px;font-size:14px;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.35)}
  .warn-item:active{opacity:.85}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    color:var(--ink);
    background:linear-gradient(180deg,var(--sk1) 0%,var(--sk2) 46%);
    min-height:100vh; padding-bottom:env(safe-area-inset-bottom);
  }
  .phone{max-width:430px;margin:0 auto;min-height:100vh;position:relative}

  /* ===== 导航 ===== */
  .nav{
    display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top) + 14px) 20px 12px; color:#fff;
  }
  .nav .loc{display:flex;align-items:center;gap:6px;font-size:18px;font-weight:700}
  .nav .icons{display:flex;gap:16px;font-size:20px}
  .nav .icons span{background:rgba(255,255,255,.2);width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;backdrop-filter:blur(4px)}
  .nav .icons span:active{transform:scale(.92)}
  .city-item{padding:14px 12px;border-radius:12px;font-size:15px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:transform .15s,background .15s}
  .city-item:hover{background:var(--hover);transform:translateY(-1px)}
  .city-item:active{background:var(--hover)}
  .city-item.active{background:var(--blue);color:#fff;font-weight:700}
  .prov-item{padding:14px 12px;border-radius:12px;font-size:15px;color:var(--ink);cursor:pointer;display:flex;justify-content:space-between;align-items:center;background:var(--card);border:1px solid var(--line);margin-bottom:8px;transition:transform .15s,background .15s}
  .prov-item:hover{background:var(--hover);transform:translateY(-1px)}
  .prov-item.back{justify-content:flex-start;color:var(--blue);font-weight:600;border-style:dashed}

  /* ===== 下拉提示 ===== */
  #pullHint{position:fixed;top:0;left:0;right:0;text-align:center;color:#5b6c88;font-size:13px;padding:14px 0 6px;transform:translateY(-30px);transition:.2s;z-index:9;pointer-events:none}

  /* ===== 离线标记 ===== */
  #offlineTag{display:none;margin:0 16px 10px;background:rgba(0,0,0,.45);color:#fff;padding:8px 14px;border-radius:12px;font-size:12px;text-align:center;backdrop-filter:blur(4px)}
  #freshTag{display:none;margin:0 16px 10px;background:rgba(242,124,34,.9);color:#fff;padding:8px 14px;border-radius:12px;font-size:12px;text-align:center;backdrop-filter:blur(4px)}

  /* ===== 主实况 ===== */
  .main-weather{text-align:center;color:#fff;padding:8px 20px 22px}
  .main-weather .big-icon{font-size:84px;line-height:1;filter:drop-shadow(0 6px 14px rgba(0,0,0,.15))}
  .main-weather .temp{font-size:80px;font-weight:800;line-height:1.05;text-shadow:0 4px 18px rgba(0,0,0,.12)}
  .main-weather .temp .unit{font-size:30px;font-weight:400;margin-left:4px;opacity:.9}
  .main-weather .cond{font-size:20px;font-weight:600;margin-top:2px}
  .main-weather .feels{font-size:14px;opacity:.92;margin-top:4px}
  .main-weather .meta{font-size:13px;opacity:.88;margin-top:10px;letter-spacing:.3px}

  .body-wrap{padding:0 16px 30px}
  .panel{background:var(--card);border-radius:20px;box-shadow:0 6px 24px rgba(31,67,120,.07);padding:6px 16px;margin-bottom:14px}
  .daily-row{display:flex;align-items:center;padding:13px 2px;border-bottom:1px solid var(--line)}
  .daily-row:last-child{border-bottom:none}
  .daily-row .d{width:74px;font-size:15px;font-weight:600}
  .daily-row .d small{display:block;font-size:11px;color:var(--sub);font-weight:400;margin-top:1px}
  .daily-row .ic{flex:1;text-align:center;font-size:24px}
  .daily-row .rain-tag{font-size:11px;color:var(--blue);width:44px;text-align:center}
  .daily-row .t{width:96px;text-align:right;font-size:15px}
  .daily-row .t .hi{font-weight:700}
  .daily-row .t .lo{color:var(--sub);margin-left:6px}

  .chart{width:100%;height:170px}

  /* ===== 几点下雨胶囊 ===== */
  .rain-pills{display:flex;flex-wrap:wrap;gap:8px;margin:2px 2px 10px}
  .pill{background:rgba(66,121,185,.13);color:#2a5f9e;border:1px solid rgba(66,121,185,.32);
        padding:6px 12px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
  html[data-theme="dark"] .pill{color:#7fb0e8;background:rgba(66,121,185,.22)}

  /* ===== 逐小时横向滚动 ===== */
  .hour-panel{padding-bottom:12px}
  .hour-wrap{overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
  .hour-wrap::-webkit-scrollbar{display:none}
  .hour-list{display:flex;gap:10px;min-width:max-content;padding:2px 2px 6px}
  .hour-item{min-width:58px;text-align:center;padding:10px 6px;border-radius:14px;background:var(--hour-bg);border:1px solid var(--line);transition:transform .15s}
  .hour-item:hover{transform:translateY(-2px)}
  .hour-item .ht{font-size:11px;color:var(--sub);white-space:nowrap}
  .hour-item .hi{font-size:22px;margin:4px 0;line-height:1}
  .hour-item .htemp{font-size:15px;font-weight:700}
  .hour-item .hrain{font-size:10px;color:var(--blue);min-height:13px}
  .hour-item.now{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 4px 12px rgba(47,127,230,.35)}
  .hour-item.now .ht,.hour-item.now .hrain{color:#e8f0ff}
  .hour-item.now .hrain{color:#ffd76a}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
  .gcard{background:var(--card);border-radius:16px;padding:14px 16px;box-shadow:0 6px 24px rgba(31,67,120,.06)}
  .gcard .l{font-size:12px;color:var(--sub)}
  .gcard .v{font-size:22px;font-weight:800;margin-top:6px}
  .gcard .u{font-size:12px;color:var(--sub);font-weight:400;margin-left:2px}
  .panel-title{font-size:14px;font-weight:700;color:var(--sub);margin:4px 2px 10px}

  /* ===== 设置弹层 ===== */
  .set-row{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink)}
  .set-btn{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 14px;font-size:13px;color:var(--ink);cursor:pointer;transition:transform .15s}
  .set-btn:hover{border-color:var(--blue);color:var(--blue);transform:translateY(-1px)}
  .set-btn.on{background:var(--blue);border-color:var(--blue);color:#fff}

  /* ===== 高弹动画 ===== */
  @keyframes popIn{from{transform:scale(.88) translateY(10px);opacity:0}to{transform:scale(1) translateY(0);opacity:1}}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  #cityMask>div,#setMask>div{animation:popIn .34s cubic-bezier(.2,1.4,.3,1)}
  .main-weather{animation:fadeUp .45s cubic-bezier(.2,1.2,.3,1) both}
  .hour-panel{animation:fadeUp .45s cubic-bezier(.2,1.2,.3,1) .05s both}
  .panel{animation:fadeUp .45s cubic-bezier(.2,1.2,.3,1) .1s both}
  .grid{animation:fadeUp .45s cubic-bezier(.2,1.2,.3,1) .15s both}
  .rain-pills .pill{animation:popIn .3s cubic-bezier(.2,1.4,.3,1) both}

  footer{text-align:center;color:var(--sub);font-size:11px;line-height:1.7;padding:8px 20px 20px}
  .error{text-align:center;padding:60px 20px;color:var(--sub)}

  /* ===== 骨架屏 ===== */
  #skeleton{padding:8px 16px 30px}
  .sk{background:linear-gradient(90deg,rgba(255,255,255,.45) 25%,rgba(255,255,255,.9) 37%,rgba(255,255,255,.45) 63%);
      background-size:400% 100%;animation:skload 1.4s ease infinite;border-radius:10px}
  @keyframes skload{0%{background-position:100% 50%}100%{background-position:0 50%}}

  /* 电脑端适配（宽屏自动放宽）—— 必须放在 .phone/.grid 定义之后才不会被覆盖 */
  @media (min-width:768px){
    .phone{max-width:980px}
    .body-wrap{padding:0 24px 40px}
    .grid{grid-template-columns:repeat(4,1fr)}
    .main-weather{padding-top:24px}
    .main-weather .big-icon{font-size:104px}
    .main-weather .temp{font-size:104px}
    footer{padding:14px 24px 30px}
    #cityMask>div,#setMask>div{width:min(680px,92vw)}
  }
  /* 平板中屏微调 */
  @media (min-width:768px) and (max-width:1199px){
    .chart{height:200px}
    .hour-item{min-width:66px}
  }
  /* 大屏/桌面宽显 */
  @media (min-width:1200px){
    .phone{max-width:1140px}
    .body-wrap{padding:0 32px 48px}
    .main-weather .big-icon{font-size:120px}
    .main-weather .temp{font-size:120px}
    .main-weather .cond{font-size:24px}
    .chart{height:220px}
    .hour-item{min-width:74px;padding:12px 8px}
    .hour-item .hi{font-size:26px}
    .hour-item .htemp{font-size:17px}
    .grid{gap:16px}
    .gcard{padding:18px 20px}
    .gcard .v{font-size:26px}
    .panel{padding:8px 20px}
    .daily-row .d{width:88px}
    .daily-row .t{width:110px}
  }
  /* 超宽屏极限 */
  @media (min-width:1800px){
    .phone{max-width:1280px}
    .grid{grid-template-columns:repeat(6,1fr)}
  }

  .sk-icon{width:80px;height:80px;border-radius:50%;margin:20px auto 16px}
  .sk-temp{width:200px;height:64px;margin:0 auto;border-radius:14px}
  .sk-line{width:150px;height:14px;margin:10px auto 0;border-radius:7px}
  .sk-meta{width:220px;height:12px;margin:14px auto 0;border-radius:6px}
  .sk-panel{background:var(--panel-soft);border-radius:20px;padding:10px 16px;margin-top:16px}
  .sk-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid rgba(255,255,255,.6)}
  .sk-row:last-child{border-bottom:none}
  .sk-cell{height:16px;border-radius:8px}
</style>
</head>
<body>
<div class="phone">
  <div id="pullHint">↓ 下拉刷新</div>

  <!-- 导航 -->
  <div class="nav">
    <span class="loc">📍<span id="cityName" onclick="toggleCityPicker()" style="cursor:pointer">扬州</span> <span onclick="toggleCityPicker()" style="font-size:12px;opacity:.8">▾</span></span>
    <div class="icons">
      <span onclick="openSettings()" title="设置">⚙</span>
    </div>
  </div>

  <!-- 气象预警横幅（有预警才显示） -->
  <div id="warnBar" style="display:none"></div>

  <!-- 城市选择弹层：先省份 → 再城市 -->
  <div id="cityMask" onclick="closeCityPicker()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;backdrop-filter:blur(2px)">
    <div onclick="event.stopPropagation()" style="background:var(--pop-bg);margin:8vh auto;border-radius:18px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:min(92vw,560px);max-height:82vh;display:flex;flex-direction:column">
      <div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--pop-title)"><span id="pickerTitle">选择省份</span> · <span id="cityCount" style="font-weight:400;font-size:12px;color:var(--sub)"></span></div>
      <div id="cityList" style="overflow-y:auto;flex:1;min-height:0;-webkit-overflow-scrolling:touch"></div>
    </div>
  </div>

  <!-- 设置弹层 -->
  <div id="setMask" onclick="closeSettings()" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:60;backdrop-filter:blur(2px)">
    <div onclick="event.stopPropagation()" style="background:var(--pop-bg);margin:20vh auto;border-radius:18px;padding:18px;box-shadow:0 12px 40px rgba(0,0,0,.25);width:min(92vw,420px)">
      <div style="font-size:15px;font-weight:700;margin-bottom:12px;color:var(--pop-title)">设置</div>
      <div class="set-row"><span>温度单位</span>
        <span style="display:flex;gap:6px">
          <button class="set-btn" data-u="C" onclick="setUnit('C')">℃</button>
          <button class="set-btn" data-u="F" onclick="setUnit('F')">℉</button>
        </span>
      </div>
      <div class="set-row"><span>主题</span>
        <span style="display:flex;gap:6px">
          <button class="set-btn" data-t="light" onclick="setTheme('light')">浅色</button>
          <button class="set-btn" data-t="dark" onclick="setTheme('dark')">深色</button>
          <button class="set-btn" data-t="auto" onclick="setTheme('auto')">跟随系统</button>
        </span>
      </div>
      <div class="set-row"><span>外观</span>
        <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">
          <button class="set-btn" data-g="classic" onclick="setGlass('classic')">经典</button>
          <button class="set-btn" data-g="liquid" onclick="setGlass('liquid')">液态玻璃</button>
        </span>
      </div>
      <div class="set-row"><span>常用城市</span>
        <button class="set-btn" onclick="favCurrent()" id="favBtn">＋ 加入当前城市</button>
      </div>
      <div id="favList" style="padding:4px 2px 2px"></div>
      <div class="set-row"><span>本地缓存</span>
        <button class="set-btn" onclick="clearCache()" style="color:#e74c3c">清除缓存</button>
      </div>
      <div style="text-align:center;margin-top:14px">
        <button class="set-btn" onclick="closeSettings()" style="width:100%;background:#eef1f6">关闭</button>
      </div>
    </div>
  </div>

  <!-- 离线缓存标记 -->
  <div id="offlineTag"></div>
  <!-- 数据滞后标记（打开自动检测） -->
  <div id="freshTag"></div>

  <!-- 骨架屏（加载前显示） -->
  <div id="skeleton">
    <div class="sk sk-icon"></div>
    <div class="sk sk-temp"></div>
    <div class="sk sk-line"></div>
    <div class="sk sk-meta"></div>
    <div class="sk-panel">
      <div class="sk-row"><div class="sk sk-cell" style="width:56px"></div><div class="sk sk-cell" style="width:24px"></div><div class="sk sk-cell" style="width:64px"></div></div>
      <div class="sk-row"><div class="sk sk-cell" style="width:56px"></div><div class="sk sk-cell" style="width:24px"></div><div class="sk sk-cell" style="width:64px"></div></div>
      <div class="sk-row"><div class="sk sk-cell" style="width:56px"></div><div class="sk sk-cell" style="width:24px"></div><div class="sk sk-cell" style="width:64px"></div></div>
      <div class="sk-row"><div class="sk sk-cell" style="width:56px"></div><div class="sk sk-cell" style="width:24px"></div><div class="sk sk-cell" style="width:64px"></div></div>
      <div class="sk-row"><div class="sk sk-cell" style="width:56px"></div><div class="sk sk-cell" style="width:24px"></div><div class="sk sk-cell" style="width:64px"></div></div>
    </div>
  </div>

  <div id="app" style="display:none"></div>
  <footer>数据：Open-Meteo 观测 + GFS/ECMWF 集成 · 每日 04:00 自动更新<br><span id="srcInfo" style="opacity:.8"></span></footer>
</div>

<script>
// ================= 配置 =================
// 城市列表：启动时从 cities.json 动态加载（297 城按省分组），切换自动记忆
const FALLBACK_CITIES = [
  {name:'扬州', file:'yangzhou',  province:'江苏省', province_file:'jiangsu'},
  {name:'无锡', file:'wuxi',      province:'江苏省', province_file:'jiangsu'},
  {name:'南京', file:'nanjing',   province:'江苏省', province_file:'jiangsu'},
  {name:'上海', file:'shanghai',  province:'上海市', province_file:'shanghai'},
  {name:'北京', file:'beijing',   province:'北京市', province_file:'beijing'}
];
// 数据源池：并行竞速自动选最快（Cloudflare Pages 自家数据优先，GitHub 兜底）
const SRC_POOL = [
  {name:'CF-Pages', tpl:u=>`https://b2-5xx.pages.dev/${u}`},
  {name:'CF-Domain',tpl:u=>`https://yzzxb2.us.ci/${u}`},
  {name:'jsDelivr', tpl:u=>`https://cdn.jsdelivr.net/gh/sishangqu/self-weather-forecast@main/${u}`},
  {name:'GitHub',  tpl:u=>`https://raw.githubusercontent.com/sishangqu/self-weather-forecast/main/${u}`},
  {name:'fastly',  tpl:u=>`https://fastly.jsdelivr.net/gh/sishangqu/self-weather-forecast@main/${u}`},

/** 多源竞速：全部并行拉，取最快成功者（自动选 GitHub / 镜像 / Cloudflare / 国内源） */
async function fetchFastest(sources){
  const jobs = sources.map(s=>{
    const t0 = performance.now();
    const ctrl = new AbortController(); const t=setTimeout(()=>ctrl.abort(),TIMEOUT_MS);
    return fetch(s.url+'?t='+Date.now(), {signal:ctrl.signal})
      .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.text(); })
      .then(text=>{ clearTimeout(t); return {name:s.name, text, latency:Math.round(performance.now()-t0)}; })
      .catch(e=>{ clearTimeout(t); throw new Error(s.name+':'+(e.name==='AbortError'?'超时':e.message)); });
  });
  const settled = await Promise.allSettled(jobs);
  const ok = settled.filter(r=>r.status==='fulfilled').map(r=>r.value).sort((a,b)=>a.latency-b.latency);
  if(!ok.length){ throw new Error(settled.map(r=>r.reason.message).join(' | ')); }
  return ok[0];   // 最快成功源
}

(function(){
  let sx=0,sy=0,active=false,pd=false;
  const TH=60;
  function isHScroll(el){ return !!(el && el.closest && (el.closest('.hour-wrap') || el.closest('.hour-list'))); }
  function inPicker(){ const m=document.getElementById('cityMask'); return m && m.style.display==='block'; }
  function start(x,y){ sx=x; sy=y; active=true; }
  function end(x,y){
    if(!active) return; active=false;
    const dx=x-sx, dy=y-sy;
    if(Math.abs(dx)<TH || Math.abs(dx)<=Math.abs(dy)) return;
    if(!FAVS.length){ toast('还没有常用城市，设置里点"＋ 加入当前城市"后可左右滑动切换'); return; }
    const i=FAVS.findIndex(f=>f.file===curCity.file);
    let next = i>=0
      ? FAVS[ dx<0 ? (i+1)%FAVS.length : (i-1+FAVS.length)%FAVS.length ]
      : FAVS[ dx<0 ? 0 : FAVS.length-1 ];
    if(next && next.file!==curCity.file) switchCity(next.file);
  }
  document.addEventListener('touchstart',e=>{ if(isHScroll(e.target)||inPicker()) return; const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
  document.addEventListener('touchend',e=>{ if(!active) return; const t=e.changedTouches[0]; end(t.clientX,t.clientY); },{passive:true});
  document.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch') return; if(isHScroll(e.target)||inPicker()) return; pd=true; start(e.clientX,e.clientY); });
  document.addEventListener('pointerup',e=>{ if(!pd) return; pd=false; end(e.clientX,e.clientY); });
})();
function showSkeleton(){ document.getElementById('skeleton').style.display='block'; document.getElementById('app').style.display='none'; weatherFx(null); }
function parse(text){
  text=text.replace(/^\uFEFF/,'');
  const lines=text.trim().split('\n'); const head=lines[0].split(',');
  const find=(...ks)=>{for(let i=0;i<head.length;i++)for(const k of ks)if(head[i].includes(k))return i;return -1};
  const iD=find('日期'),iH=find('最高温'),iL=find('最低温'),iA=find('平均温'),iAA=find('体感平均');
  const iR=find('降水量'),iP=find('降水概率'),iW=find('最大风速'),iG=find('最大阵风'),
        iDir=find('主导风向'),iHum=find('平均湿度'),iPre=find('平均气压'),iCl=find('平均云量'),iDt=find('昼夜温差');
  const num=s=>{const v=parseFloat(s);return isNaN(v)?null:v};
  return lines.slice(1).filter(l=>l.trim()).map(l=>{const c=l.split(',');
    return {date:(c[iD]||'').trim(),high:num(c[iH]),low:num(c[iL]),avg:num(c[iA]),aavg:num(c[iAA]),
      rain:num(c[iR]),prob:num(c[iP]),wind:num(c[iW]),gust:num(c[iG]),dir:(c[iDir]||'').trim(),
      hum:num(c[iHum]),pres:num(c[iPre]),cloud:num(c[iCl]),dt:num(c[iDt])}});
}
function parseHourly(text){
  text=text.replace(/^\uFEFF/,'');
  const lines=text.trim().split('\n'); if(lines.length<2) return [];
  const head=lines[0].split(',');
  const find=(...ks)=>{for(let i=0;i<head.length;i++)for(const k of ks)if(head[i].includes(k))return i;return -1};
  const iT=find('时间'),iA=find('温度'),iF=find('体感'),iP=find('降水概率'),iR=find('降水量'),
        iW=find('天气代码'),iS=find('风速'),iH=find('湿度'),iC=find('云量');
  const num=s=>{const v=parseFloat(s);return isNaN(v)?null:v};
  return lines.slice(1).filter(l=>l.trim()).map(l=>{const c=l.split(',');
    const t=new Date((c[iT]||'').trim().replace(' ','T')+':00');
    return {time:t,tstr:(c[iT]||'').trim(),temp:num(c[iA]),feels:num(c[iF]),prob:num(c[iP]),rain:num(c[iR]),
      wcode:(c[iW]||'').trim(),wind:num(c[iS]),hum:num(c[iH]),cloud:num(c[iC])}}).filter(h=>!isNaN(h.time));
}

/** 锁定当前时段：从 >= 当前小时的第一条开始，取 HOURLY_SHOW(36) 条；全量 72h 已在缓存 */
function lockCurrentHour(hourly, count){
  count = count || HOURLY_SHOW;
  if(!hourly||!hourly.length) return [];
  const now=new Date(); now.setMinutes(0,0,0);
  let idx=hourly.findIndex(h=>h.time>=now);
  if(idx<0) idx=0;
  return hourly.slice(idx, idx+count);
}

/** 打开自动检测数据是否最新：首行日期 === 今天 */
function isFresh(rows){
  if(!rows||!rows.length) return true;
  const d=new Date();
  const today=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  return rows[0].date === today;
}
const freshStr=()=>{const d=new Date(); return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');};

/** 几点下雨胶囊：扫描逐小时，降水概率>=50% 或降水量>0.1mm 的连续时段 */
function rainPills(hourly){
  if(!hourly||!hourly.length) return [];
  const segs=[]; let cur=null;
  const rainy=h=>(h.prob!=null&&h.prob>=50)||(h.rain!=null&&h.rain>=0.5);   // 概率≥50% 或降水≥0.5mm
  hourly.forEach(h=>{
    if(rainy(h)){ if(!cur) cur={start:h,end:h}; else cur.end=h; }
    else if(cur){ segs.push(cur); cur=null; }
  });
  if(cur) segs.push(cur);
  const today=new Date().getDate();
  const fmt=t=>{const mm=t.getMonth()+1, dd=t.getDate(), hh=t.getHours();
    return (dd===today?'今天':(mm+'/'+dd))+' '+hh+':00';};
  return segs.slice(0,3).map(s=>{
    const same = s.start.time.getTime()===s.end.time.getTime();
    return same ? fmt(s.start.time) : fmt(s.start.time)+'–'+s.end.time.getHours()+':00';
  });
}

async function load(showSpin){
  document.getElementById('cityName').textContent = curCity.name;
  // SWR：先秒显本地缓存，同时后台拉最新数据，回来再替换
  const cache0 = getCache();
  let staleShown=false;
  if(cache0 && cache0.rows && cache0.rows.length){
    await loadEcharts(0);
    render(cache0.rows, reviveHourly(cache0.hourly), false, true, getAux());
    staleShown=true;
  }
  let rows=null, hourly=null, aux=null, offline=false, srcInfoTmp='';
  try{
    const [t1,t2,t3]=await Promise.allSettled([fetchFastest(makeDaily(curCity)),fetchFastest(makeHourly(curCity)),fetchFastest(makeAux(curCity))]);
    if(t1.status!=='fulfilled') throw new Error(t1.reason&&t1.reason.message?t1.reason.message:'CSV 拉取失败');
    rows=parse(t1.value.text); srcInfoTmp = t1.value.name+' '+t1.value.latency+'ms';
    if(!rows.length) throw new Error('CSV 为空');
    if(t2.status==='fulfilled'){ hourly=parseHourly(t2.value.text); if(!hourly.length) hourly=null; }
    if(t3.status==='fulfilled'){ try{ aux=JSON.parse(t3.value.text); }catch(e){ aux=null; } }
    saveCache(rows,hourly);          // 全量 72h 逐小时 + 7 天预报，本地存一份
    if(aux) saveAux(aux);            // AQI/UV/预警/生活指数 也存一份
  }catch(e){
    if(staleShown) return;           // 已有缓存渲染，后台拉取失败就保持现状
    const c=getCache();
    if(c && c.rows && c.rows.length){
      rows=c.rows; hourly=reviveHourly(c.hourly); offline=true; srcInfoTmp='本地缓存';           // 离线兜底：用缓存
      aux=getAux();
    }else{
      document.getElementById('skeleton').style.display='none';
      const app=document.getElementById('app'); app.style.display='block';
      app.innerHTML=`<div class="error">⚠️ 网络不可用，且无缓存数据<br><br>请联网后下拉刷新</div>`;
      return;
    }
  }
  if(!staleShown) await loadEcharts(0);
  srcInfo = srcInfoTmp;
  render(rows, hourly, offline, false, aux);
}

function render(rows, hourly, offline, stale, aux){

  const _dark=document.documentElement.getAttribute('data-theme')==='dark';
  // 深色主题下固定深蓝渐变（避免天气动态色覆盖深色变量）
  document.documentElement.style.setProperty('--sk1', _dark ? '#222c42' : s1);
  document.documentElement.style.setProperty('--sk2', _dark ? '#141a28' : s2);
  // 天气动效：雨/雪/烈日
  weatherFx(decideFx(t));

  const tag=document.getElementById('offlineTag');
  if(offline){
    tag.style.display='block';
    tag.textContent='⚠️ 离线模式 · 显示上次缓存数据（请联网下拉刷新）';
  } else tag.style.display='none';

  // ==== 打开自动检测：数据是否最新（SWR 缓存渲染时不提示，等新数据回来再判断） ====
  const freshTag=document.getElementById('freshTag');
  if(!offline && !stale && !isFresh(rows)){
    freshTag.style.display='block';
    freshTag.textContent='⏳ 数据更新于 '+rows[0].date+'（今天 '+freshStr()+'），Actions 可能还没跑，下拉可重试';
  } else freshTag.style.display='none';

  // ==== 气象预警横幅（AQI/UV/预警/生活指数来自 aux.json） ====
  const wb=document.getElementById('warnBar');
  const warns=(aux && aux.warnings && aux.warnings.length) ? aux.warnings : [];
  if(warns.length){
    const color = /红/.test(warns[0].title)?'#e53935':/橙/.test(warns[0].title)?'#f27c22':/黄/.test(warns[0].title)?'#f2c029':/蓝/.test(warns[0].title)?'#348FEB':'#f27c22';
    wb.style.display='block';
    wb.innerHTML = warns.slice(0,2).map(w=>`<a class="warn-item" style="background:${color}" href="${w.url}" target="_blank" rel="noopener">⚠️ ${w.title}<small style="opacity:.85">${w.time||''}</small></a>`).join('');
  } else wb.style.display='none';

  let html=`<div class="main-weather">
    <div class="big-icon">${iconFor(t.prob,t.cloud)}</div>
    <div class="temp">${fmtT(t.avg)}<span class="unit">°${UNIT}</span></div>
    <div class="cond">${t.dir||'—'}风 · ${t.prob>=50?'有降水':t.cloud>=80?'阴':t.cloud>=50?'多云':'晴'}</div>
    <div class="feels">体感 ${fmtT(t.aavg)}°${UNIT}</div>
    <div class="meta">湿度 ${t.hum==null?'--':t.hum.toFixed(0)}% · 最大风 ${t.wind==null?'--':t.wind.toFixed(0)}km/h · 气压 ${t.pres==null?'--':t.pres.toFixed(0)}hPa</div>
  </div>`;

  // ==== 逐小时预报：锁定当前时段（从 >= 当前小时的第一条开始，显示 36h） ====
  const hourItems = lockCurrentHour(hourly);
  if(hourItems.length){
    const now=new Date(); const today=now.getDate();
    const cards=hourItems.map(h=>{
      const isNow = h.time.getMonth()===now.getMonth() && h.time.getDate()===now.getDate() && h.time.getHours()===now.getHours();
      const label = isNow ? '现在' : (h.time.getDate()===today ? h.time.getHours()+'时' : (h.time.getMonth()+1)+'/'+h.time.getDate()+' '+h.time.getHours()+'时');
      return `<div class="hour-item${isNow?' now':''}">
        <div class="ht">${label}</div>
        <div class="hi">${wIcon(h.wcode)}</div>
        <div class="htemp">${fmtT(h.temp)}°</div>
        <div class="hrain">${h.prob!=null&&h.prob>=30?('☔'+h.prob+'%'):''}</div>
      </div>`;
    }).join('');
    // ==== 几点下雨提示胶囊 ====
    const pills = rainPills(hourItems);
    html+=`<div class="panel hour-panel">
      <div class="panel-title">逐小时 · 从当前时段起 ${hourItems.length}h</div>
      ${pills.length?`<div class="rain-pills">${pills.map(p=>`<span class="pill">☔ ${p}</span>`).join('')}</div>`:''}
      <div class="hour-wrap"><div class="hour-list">${cards}</div></div>
    </div>`;
  }

  const days=rows.map(r=>{const d=new Date(r.date+'T00:00:00');
    return `<div class="daily-row">
      <div class="d">周${WEEK[d.getDay()]}<small>${r.date.slice(5)}</small></div>
      <div class="ic">${iconFor(r.prob,r.cloud)}</div>
      <div class="rain-tag">${r.prob!=null&&r.prob>=25?('☔'+r.prob+'%'):''}</div>
      <div class="t"><span class="hi">${fmtT(r.high)}°</span><span class="lo">${fmtT(r.low)}°</span></div>
    </div>`}).join('');
  html+=`<div class="body-wrap">
    <div class="panel"><div class="panel-title">未来 ${rows.length} 天预报</div>${days}
      <div id="chartT" class="chart"></div></div>
    <div class="panel-title">实况指标</div>
    <div class="grid">
      ${gc('体感',fmtT(t.aavg),'°'+UNIT,`最高${fmtT(t.high)}° / 最低${fmtT(t.low)}°`)}
      ${gc('空气质量', aux&&aux.aqi&&aux.aqi.value!=null?Math.round(aux.aqi.value):'--', aux&&aux.aqi?aqiLevel(aux.aqi.value):'', aux&&aux.aqi&&aux.aqi.pm25!=null?('PM2.5 '+Math.round(aux.aqi.pm25)):'')}
      ${gc('紫外线', aux&&aux.uv&&aux.uv.today!=null?aux.uv.today:'--', aux&&aux.uv?uvLevel(aux.uv.today):'', aux&&aux.uv&&aux.uv.week&&aux.uv.week[1]!=null?('明日 '+aux.uv.week[1]):'')}
      ${gc('降水量',t.rain,'mm','今日累计')}
      ${gc('最大阵风',t.gust,'km/h','')}
      ${gc('云量',t.cloud,'%','')}
      ${gc('昼夜温差',t.dt,'°C','')}
      ${gc('降水概率',t.prob,'%',t.prob>=50?'注意带伞':'')}
    </div>
    ${aux && aux['生活指数'] ? `<div class="panel-title">生活指数</div>
    <div class="grid">
      ${(()=>{const d=aux['生活指数']['穿衣']||'';const m=d.split('，')[0];const s=d.includes('，')?d.split('，').slice(1).join('，'):'';return gc('穿衣',m,'',s);})()}
      ${gc('洗车',aux['生活指数']['洗车'],'','')}
      ${gc('运动',aux['生活指数']['运动'],'','')}
      ${gc('感冒',aux['生活指数']['感冒'],'','')}
    </div>` : ''}
  </div>`;

  app.innerHTML=html;

  if(echartsReady){
    const el=document.getElementById('chartT'); if(!el) return;
    const c=echarts.init(el); charts.push(c);
    const x=rows.map(r=>r.date.slice(5));
    const cv=UNIT==='F'?v=>v==null?null:Math.round(v*9/5+32):v=>v;
    const dark=document.documentElement.getAttribute('data-theme')==='dark';
    const axisC=dark?'#8fa1bd':'#5b6c88';
    c.setOption({tooltip:{trigger:'axis',backgroundColor:dark?'#232e44':'#fff',borderColor:'rgba(0,0,0,.1)',textStyle:{color:dark?'#e8edf7':'#1b2a4a'}},legend:{data:['最高','平均','最低'],top:0,itemWidth:12,itemHeight:8,textStyle:{fontSize:10,color:axisC}},
      grid:{left:36,right:10,top:26,bottom:20},xAxis:{type:'category',data:x,boundaryGap:false,axisLabel:{fontSize:9,color:axisC},axisLine:{lineStyle:{color:axisC}}},
      yAxis:{type:'value',name:'°'+UNIT,nameTextStyle:{fontSize:9,color:axisC},axisLabel:{fontSize:9,color:axisC},splitLine:{lineStyle:{color:dark?'#2c3a52':'#e6edf6'}}},series:[
      {name:'最高',type:'line',data:rows.map(r=>cv(r.high)),smooth:true,lineStyle:{width:2,color:'#ff9f43'},itemStyle:{color:'#ff9f43'},symbolSize:5},
      {name:'平均',type:'line',data:rows.map(r=>cv(r.avg)),smooth:true,lineStyle:{width:2.5,color:'#ff6b6b'},itemStyle:{color:'#ff6b6b'},symbolSize:5},
      {name:'最低',type:'line',data:rows.map(r=>cv(r.low)),smooth:true,lineStyle:{width:2,color:'#2f7fe6'},itemStyle:{color:'#2f7fe6'},symbolSize:5}]});
  } else {
    const el=document.getElementById('chartT'); if(el) el.style.display='none';
  }
}
function gc(l,v,u,s){return `<div class="gcard"><div class="l">${l}</div><div class="v">${v==null?'--':(typeof v==='string'?v:(Number.isInteger(v)?v:v.toFixed(1)))}<span class="u">${u}</span></div><div style="font-size:11px;color:#5b6c88;margin-top:3px">${s||''}</div></div>`}

// ================= 设置：温度单位 / 主题 / 缓存 =================
let UNIT='C'; try{ UNIT=localStorage.getItem('wx_unit')||'C'; }catch(e){}
let THEME='auto'; try{ THEME=localStorage.getItem('wx_theme')||'auto'; }catch(e){}
const fmtT=v=>{ if(v==null) return '--'; return UNIT==='F' ? String(Math.round(v*9/5+32)) : String(Math.round(v)); };
function applyTheme(){
  const t = THEME==='auto' ? (matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light') : THEME;
  document.documentElement.setAttribute('data-theme', t);
}
function paintSetBtns(){
  document.querySelectorAll('#setMask .set-btn[data-u]').forEach(b=>b.classList.toggle('on', b.dataset.u===UNIT));
  document.querySelectorAll('#setMask .set-btn[data-t]').forEach(b=>b.classList.toggle('on', b.dataset.t===THEME));
  document.querySelectorAll('#setMask .set-btn[data-g]').forEach(b=>b.classList.toggle('on', b.dataset.g===GLASS));
}
function openSettings(){ paintSetBtns(); paintFavs(); document.getElementById('setMask').style.display='block'; }
function closeSettings(){ document.getElementById('setMask').style.display='none'; }
function setUnit(u){ UNIT=u; try{ localStorage.setItem('wx_unit',u); }catch(e){} paintSetBtns(); if(document.getElementById('app').style.display!=='none') load(false); }
// ================= 外观：经典 / 液态玻璃 =================
let GLASS='classic'; try{ GLASS=localStorage.getItem('wx_glass')||'classic'; }catch(e){}
function applyGlass(){ document.documentElement.setAttribute('data-glass', GLASS==='frosted'?'classic':GLASS); }
function setGlass(g){ GLASS=g; try{ localStorage.setItem('wx_glass',g); }catch(e){} paintSetBtns(); applyGlass(); }
function setTheme(t){ THEME=t; try{ localStorage.setItem('wx_theme',t); }catch(e){} paintSetBtns(); applyTheme(); if(typeof charts!=='undefined' && charts.length) load(false); if(WFX) weatherFx(WFX.type); }
function clearCache(){
  try{ const ks=[]; for(let i=0;i<localStorage.length;i++){ const k=localStorage.key(i); if(k&&k.startsWith('wx_cache_')) ks.push(k);} ks.forEach(k=>localStorage.removeItem(k)); }catch(e){}
  toast('缓存已清除，下拉即可刷新');
}
applyTheme();
applyGlass();

// ================= 天气动效：雨 / 雪 / 烈日 =================
let WFX=null;
/** 根据当天实况判断动效类型 */
function decideFx(t){
  if(!t) return null;
  const snow = (t.avg!=null && t.avg<=2 && t.prob>=40) || (t.high!=null && t.high<=4 && t.prob>=50);
  if(snow) return 'snow';
  // 雨：强降水概率，或"降水+阴云"（避免晴天因微量降水误判下雨）
  if(t.prob>=50 || (t.rain!=null && t.rain>=0.5 && t.cloud!=null && t.cloud>=60)) return 'rain';
  if(t.cloud!=null && t.cloud<=30 && t.prob<30 && t.avg!=null && t.avg>=26) return 'sun';
  return null;
}
/** canvas 粒子层：rain 雨滴 / snow 雪花 / sun 烈日光线，页面隐藏自动暂停 */
function weatherFx(type){
  if(!type){ if(WFX){ cancelAnimationFrame(WFX.raf); WFX.kill(); WFX.el.remove(); WFX=null; } return; }
  if(WFX && WFX.type===type) return;
  if(WFX){ cancelAnimationFrame(WFX.raf); WFX.kill(); WFX.el.remove(); WFX=null; }
  const el=document.createElement('canvas');
  el.style.cssText='position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none';
  document.body.insertBefore(el, document.body.firstChild);
  const c=el.getContext('2d');
  const DPR=Math.min(2, window.devicePixelRatio||1);
  let W=0,H=0;
  const size=()=>{ W=window.innerWidth; H=window.innerHeight; el.width=W*DPR; el.height=H*DPR; c.setTransform(DPR,0,0,DPR,0,0); };
  size(); window.addEventListener('resize', size);
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const CFG = type==='rain'
    ? {n:Math.round(W*H/15000)+20, sp:[8,13], len:[12,18], col:dark?'150,190,235':'120,170,230'}
    : type==='snow'
      ? {n:Math.round(W*H/38000)+15, sp:[0.7,2.1], r:[1,3]}
      : {};
  const parts=Array.from({length:CFG.n||0},()=>({
    x:Math.random()*W, y:Math.random()*H,
    v:CFG.sp[0]+Math.random()*(CFG.sp[1]-CFG.sp[0]),
    len:CFG.len?CFG.len[0]+Math.random()*(CFG.len[1]-CFG.len[0]):3,
    r:CFG.r?CFG.r[0]+Math.random()*(CFG.r[1]-CFG.r[0]):2,
    ph:Math.random()*6.283
  }));
  let t0=performance.now();
  function frame(){
    if(document.hidden){ WFX.raf=requestAnimationFrame(frame); return; }
    const now=performance.now(), dt=Math.min(50,now-t0)/16.7; t0=now;
    c.clearRect(0,0,W,H);
    if(type==='rain'){
      c.strokeStyle=`rgba(${CFG.col},.72)`; c.lineWidth=2.2;
      for(const p of parts){
        p.y+=p.v*dt; p.x+=p.v*0.22*dt;
        if(p.y>H+20){ p.y=-20; p.x=Math.random()*W; }
        c.beginPath(); c.moveTo(p.x,p.y); c.lineTo(p.x-p.v*0.22*3, p.y-p.len); c.stroke();
      }
    } else if(type==='snow'){
      for(const p of parts){
        p.y+=p.v*dt; p.x+=Math.sin(p.ph+now/900)*0.5;
        if(p.y>H+12){ p.y=-12; p.x=Math.random()*W; p.ph=Math.random()*6.283; }
        c.beginPath(); c.arc(p.x,p.y,p.r,0,6.283);
        c.fillStyle=`rgba(255,255,255,${0.35+Math.random()*0.5})`; c.fill();
      }
    } else if(type==='sun'){
      const gx=W*0.5, gy=H*0.08, R=Math.max(W,H)*0.55;
      const gr=c.createRadialGradient(gx,gy,0,gx,gy,R);
      gr.addColorStop(0,'rgba(255,220,120,.34)'); gr.addColorStop(.3,'rgba(255,190,80,.14)'); gr.addColorStop(1,'rgba(255,180,60,0)');
      c.fillStyle=gr; c.fillRect(0,0,W,H);
      c.save(); c.translate(gx,gy); c.rotate(now/18000); c.strokeStyle='rgba(255,215,130,.28)'; c.lineWidth=2.5;
      for(let i=0;i<12;i++){ c.rotate(Math.PI/6); c.beginPath(); c.moveTo(70,0); c.lineTo(R*0.92,0); c.stroke(); }
      c.restore();
      const core=c.createRadialGradient(gx,gy,0,gx,gy,90);
      core.addColorStop(0,'rgba(255,235,160,.6)'); core.addColorStop(1,'rgba(255,225,130,0)');
      c.fillStyle=core; c.fillRect(0,0,W,H);
    }
    WFX.raf=requestAnimationFrame(frame);
  }
  WFX={type, el, c, raf:requestAnimationFrame(frame), kill:()=>window.removeEventListener('resize',size)};
}

let toastTimer;
function toast(msg){let el=document.getElementById('toast'); if(!el){el=document.createElement('div');el.id='toast';
  el.style.cssText='position:fixed;left:50%;bottom:80px;transform:translateX(-50%);background:rgba(0,0,0,.75);color:#fff;padding:10px 18px;border-radius:10px;font-size:13px;z-index:99;transition:.3s;opacity:0';
  document.body.appendChild(el)} el.textContent=msg; el.style.opacity=1;
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>el.style.opacity=0,2000)}

// 供鸿蒙原生桥接调用：window.refreshWeather()
window.refreshWeather = function(){ load(true); return 'ok'; };

// ===== 页面内下拉刷新（Web 内也可用） =====
(function(){
  const ph=document.getElementById('pullHint'); let sy=0, pulling=false, dist=0;
  window.addEventListener('touchstart',e=>{if(window.scrollY<=0){sy=e.touches[0].clientY;pulling=true;dist=0}},{passive:true});
  window.addEventListener('touchmove',e=>{if(pulling){dist=Math.max(0,e.touches[0].clientY-sy);
    ph.style.transform=`translateY(${Math.min(80,dist*0.6)}px)`; ph.style.opacity=dist>40?1:0.4}},{passive:true});
  window.addEventListener('touchend',()=>{if(pulling&&dist>70){ph.style.transform='translateY(-30px)';load(true)}
    else ph.style.transform='translateY(-30px)'; ph.style.opacity=0; pulling=false; dist=0},{passive:true});
})();

window.onload=async ()=>{
  // 先加载 cities.json（297 城清单），失败则用内置兜底城市
  try{
    const r=await fetchFastest(makeCitiesSources());
    CITY_GROUPS=JSON.parse(r.text);
    if(!Array.isArray(CITY_GROUPS)||!CITY_GROUPS.length) CITY_GROUPS=null;
  }catch(e){ CITY_GROUPS=null; }
  initCity();
  load(true);
};
